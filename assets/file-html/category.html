<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>عرض المنتجات في القسم</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
</head>
<body>
  <div class="container mt-5">
    <!-- العنوان في الصفحة -->
    <h1 id="section-title" class="mb-4">عرض المنتجات</h1>

    <!-- زر عرض السلة -->
    <button id="cart-toggle" class="btn btn-warning mb-3 position-relative" onclick="toggleCart()">
      🛒 عرض السلة 
      <span id="cart-count" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
        0
      </span>
    </button>
    
    <div id="cart-details" class="card p-3 d-none">
      <h5 class="mb-3">تفاصيل السلة:</h5>
      <ul id="cart-items" class="list-group mb-3"></ul>
      <h6 id="cart-total"></h6>

      <!-- فورم بيانات العميل داخل السلة -->
      <h4>بيانات العميل</h4>
      <form id="order-form">
        <div class="mb-3">
          <label for="customer-name" class="form-label">اسم العميل</label>
          <input type="text" class="form-control" id="customer-name" required>
        </div>
        <div class="mb-3">
          <label for="customer-email" class="form-label">البريد الإلكتروني</label>
          <input type="email" class="form-control" id="customer-email" required>
        </div>
        <div class="mb-3">
          <label for="customer-phone" class="form-label">رقم الهاتف</label>
          <input type="tel" class="form-control" id="customer-phone" required>
        </div>
        <div class="mb-3">
          <label for="customer-alt-phone" class="form-label">رقم الهاتف البديل</label>
          <input type="tel" class="form-control" id="customer-alt-phone">
        </div>
        <div class="mb-3">
          <label for="customer-address" class="form-label">العنوان</label>
          <textarea class="form-control" id="customer-address" rows="3" required></textarea>
        </div>
        <button type="submit" class="btn btn-success">إتمام الطلب</button>
      </form>
    </div>

    <!-- رسالة تأكيد إضافة منتج إلى السلة -->
    <div id="add-to-cart-message" class="alert alert-success d-none mt-3" role="alert">
      تم إضافة المنتج إلى السلة بنجاح!
    </div>
  </div>

  <div id="loader" class="text-center" style="display: none;">
    <div class="spinner-border" role="status"><span class="visually-hidden">Loading...</span></div>
  </div>

  <div id="products" class="container mt-5">
    <div class="row" id="product-list"></div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBJkpqCGBRITqc66TQtkdQ_Rj0Jwd5uhZI",
      authDomain: "company-23271.firebaseapp.com",
      databaseURL: "https://company-23271-default-rtdb.firebaseio.com",
      projectId: "company-23271",
      storageBucket: "company-23271.firebasestorage.app",
      messagingSenderId: "48019146673",
      appId: "1:48019146673:web:b4f7bc91bb169c43b29f90"
    };
  
    const app = firebase.initializeApp(firebaseConfig);
    const db = firebase.database(app);
  
    const cart = [];
  
    // تحميل المنتجات بناءً على القسم
    function loadProductsFromCategory() {
      const loader = document.getElementById('loader');
      const productList = document.getElementById('product-list');
      const categoryName = new URLSearchParams(window.location.search).get('name');
      loader.style.display = 'block';
  
      // تعيين العنوان للقسم
      const sectionTitle = document.getElementById('section-title');
      sectionTitle.textContent = `عرض منتجات قسم: ${categoryName}`;
  
      db.ref('products').on('value', (snapshot) => {
        const data = snapshot.val();
        productList.innerHTML = '';
        
        if (data && data[categoryName]) {
          const products = Array.isArray(data[categoryName]) ? data[categoryName] : Object.values(data[categoryName]);
  
          products.forEach(product => {
            const productCard = document.createElement('div');
            productCard.classList.add('col-md-4', 'mb-4');
            productCard.innerHTML = `
              <div class="card h-100">
                <img src="${product.image}" class="card-img-top" alt="${product.name}">
                <div class="card-body">
                  <h5 class="card-title">${product.name}</h5>
                  <p class="card-text">السعر: ${product.price} جنيه</p>
                  <div class="mb-2">
                    <label class="form-label">الكمية:</label>
                    <input type="number" min="1" max="20" value="1" class="form-control form-control-sm" id="qty-${product.name}">
                  </div>
                  <button class="btn btn-primary" onclick='addToCart(${JSON.stringify(product)})'>اضف الى السلة</button>
                </div>
              </div>
            `;
            productList.appendChild(productCard);
          });
        } else {
          productList.innerHTML = '<p>لا توجد منتجات في هذا القسم</p>';
        }
  
        loader.style.display = 'none';
      }, error => console.error('Error loading products: ', error));
    }
  
    // إضافة المنتج إلى السلة
    function addToCart(product) {
      const qtyInput = document.getElementById(`qty-${product.name}`);
      const quantity = parseInt(qtyInput.value);
  
      if (isNaN(quantity) || quantity <= 0) return;
  
      const existingItem = cart.find(item => item.name === product.name);
      if (existingItem) {
        existingItem.quantity += quantity;
      } else {
        cart.push({ name: product.name, price: product.price, quantity });
      }
  
      updateCartUI();
      showAddToCartMessage(product.name); // عرض رسالة إضافة المنتج
    }
  
    // عرض رسالة إضافة المنتج إلى السلة
    function showAddToCartMessage(productName) {
      const message = document.getElementById("add-to-cart-message");
      message.textContent = `تم إضافة ${productName} إلى السلة بنجاح!`;
      message.classList.remove('d-none');
  
      // إخفاء الرسالة بعد 3 ثواني
      setTimeout(() => {
        message.classList.add('d-none');
      }, 3000);
    }
  
    // تحديث واجهة السلة
    function updateCartUI() {
      const cartItems = document.getElementById("cart-items");
      const cartTotal = document.getElementById("cart-total");
      const cartCount = document.getElementById("cart-count");
  
      cartItems.innerHTML = '';
      let total = 0;
      let totalProductCount = 0;
  
      cart.forEach(item => {
        const subtotal = item.quantity * item.price;
        total += subtotal;
        totalProductCount++;
  
        const li = document.createElement("li");
        li.className = "list-group-item";
        li.textContent = `${item.name} - ${item.quantity} × ${item.price} = ${subtotal.toFixed(2)} جنيه`;
  
        const qtyInput = document.createElement("input");
        qtyInput.type = "number";
        qtyInput.min = 1;
        qtyInput.value = item.quantity;
        qtyInput.classList.add("form-control", "form-control-sm", "d-inline", "w-auto", "ms-2");
        qtyInput.addEventListener('change', (e) => {
          updateQuantityInCart(item, parseInt(e.target.value));
        });
  
        const deleteBtn = document.createElement('button');
        deleteBtn.textContent = "حذف";
        deleteBtn.classList.add('btn', 'btn-danger', 'btn-sm', 'ms-3');
        deleteBtn.onclick = () => removeFromCart(item);
  
        li.appendChild(qtyInput);
        li.appendChild(deleteBtn);
        cartItems.appendChild(li);
      });
  
      cartTotal.textContent = `إجمالي الطلب: ${total.toFixed(2)} جنيه`;
      cartCount.textContent = totalProductCount;
    }
  
    // إزالة منتج من السلة
    function removeFromCart(item) {
      const index = cart.findIndex(cartItem => cartItem.name === item.name && cartItem.price === item.price);
      if (index > -1) {
        cart.splice(index, 1);
        updateCartUI();
      }
    }
  
    // تحديث الكمية في السلة
    function updateQuantityInCart(item, newQuantity) {
      const existing = cart.find(cartItem => cartItem.name === item.name && cartItem.price === item.price);
      if (existing && newQuantity > 0) {
        existing.quantity = newQuantity;
      } else {
        alert("الكمية يجب أن تكون أكبر من 0");
      }
      updateCartUI();
    }
  
    // تبديل عرض السلة
    function toggleCart() {
      const cartDetails = document.getElementById("cart-details");
      cartDetails.classList.toggle("d-none");
    }
  
    // العثور على أكبر ID في customers
    function getNextCustomerId() {
      return db.ref('customers').once('value').then(snapshot => {
        const customers = snapshot.val();
        const customerIds = Object.keys(customers || {});
        if (customerIds.length === 0) {
          return '00001'; // إذا كانت القائمة فارغة، نبدأ من '00001'
        }
  
        // العثور على أكبر ID
        const lastId = customerIds.reduce((max, id) => (parseInt(id) > parseInt(max) ? id : max), customerIds[0]);
        const newId = (parseInt(lastId) + 1).toString().padStart(5, '0'); // زيادة ID وتنسيقه
        return newId;
      });
    }
  
    // معالجة نموذج الطلب
    document.getElementById('order-form').addEventListener('submit', function(e) {
      e.preventDefault();
  
      const customerName = document.getElementById('customer-name').value;
      const customerEmail = document.getElementById('customer-email').value;
      const customerPhone = document.getElementById('customer-phone').value;
      const customerAltPhone = document.getElementById('customer-alt-phone').value;
      const customerAddress = document.getElementById('customer-address').value;
  
      if (cart.length === 0) {
        alert("يجب إضافة منتجات إلى السلة أولاً.");
        return;
      }
  
      getNextCustomerId().then(customerId => {
        const customerData = {
          id: customerId,
          name: customerName,
          email: customerEmail,
          phone: customerPhone,
          altPhone: customerAltPhone,
          address: customerAddress,
          order: cart,
          totalAmount: cart.reduce((sum, item) => sum + (item.price * item.quantity), 0),
          timestamp: new Date().toISOString(),
        };
  
        // إرسال الطلب إلى Firebase في قائمة customers
        db.ref('customers/' + customerId).set(customerData).then(() => {
          alert("تم إرسال الطلب بنجاح!");
          cart.length = 0;  // مسح السلة
          updateCartUI();  // تحديث واجهة السلة
          document.getElementById('order-form').reset();  // مسح النموذج
        }).catch(error => {
          console.error("Error saving customer data: ", error);
          alert("حدث خطأ أثناء إرسال الطلب.");
        });
      });
    });
  
    window.onload = loadProductsFromCategory;
  </script>
  
  
</body>
</html>
