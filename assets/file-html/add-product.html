<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>إضافة منتج</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    #loader { display: none; }
    #category-actions { display: none; }
    .alert {
      display: none;
    }
  </style>
</head>
<body class="bg-light p-4">

    <div class="container">
        <h2>إضافة منتج جديد</h2>
      
        <select id="category-select" class="form-select mb-2"></select>
        <input type="text" id="new-category-input" class="form-control mb-2" placeholder="اسم القسم الجديد" style="display:none;">
        
        <!-- أزرار تعديل وحذف القسم -->
        <div id="category-actions" class="mt-3">
          <button id="edit-category-btn" class="btn btn-warning mb-2">تعديل القسم</button>
          <button id="delete-category-btn" class="btn btn-danger mb-2">حذف القسم</button>
        </div>
        
        <!-- حقل تعديل اسم القسم -->
        <div id="edit-category-container" class="mb-3" style="display: none;">
          <input type="text" id="edit-category-name" class="form-control" placeholder="أدخل اسم القسم الجديد">
          <button id="save-edit-category-btn" class="btn btn-primary mt-2">حفظ التعديل</button>
        </div>

        <!-- رسالة التأكيد أو الخطأ -->
        <div id="confirmation-message" class="alert alert-info"></div>

        <input type="text" id="product-name" class="form-control mb-2" placeholder="اسم المنتج">
        <input type="number" id="product-price" class="form-control mb-2" placeholder="السعر">
        <input type="text" id="product-image" class="form-control mb-2" placeholder="رابط الصورة">
      
        <button id="add-btn" class="btn btn-success">إضافة المنتج</button>
        <div id="loader" style="display:none">⏳ جاري الإضافة...</div>
        <div id="message" class="mt-2 fw-bold"></div>
    </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
  <script type="module">
    // إعداد Firebase
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
    import { getDatabase, ref, onValue, set, get, update, remove } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBJkpqCGBRITqc66TQtkdQ_Rj0Jwd5uhZI",
      authDomain: "company-23271.firebaseapp.com",
      databaseURL: "https://company-23271-default-rtdb.firebaseio.com",
      projectId: "company-23271",
      storageBucket: "company-23271.firebasestorage.app",
      messagingSenderId: "48019146673",
      appId: "1:48019146673:web:b4f7bc91bb169c43b29f90"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const productsRef = ref(db, "products");
  
    // تحميل الأقسام داخل select
    const categorySelect = document.getElementById("category-select");
    const newCategoryInput = document.getElementById("new-category-input");
    const loader = document.getElementById("loader");
    const messageDiv = document.getElementById("message");
    const categoryActions = document.getElementById("category-actions");
    const editCategoryBtn = document.getElementById("edit-category-btn");
    const deleteCategoryBtn = document.getElementById("delete-category-btn");
    const editCategoryContainer = document.getElementById("edit-category-container");
    const editCategoryNameInput = document.getElementById("edit-category-name");
    const saveEditCategoryBtn = document.getElementById("save-edit-category-btn");
    const confirmationMessage = document.getElementById("confirmation-message");
  
    function showMessage(msg, color = "green") {
      confirmationMessage.innerText = msg;
      confirmationMessage.style.color = color;
      confirmationMessage.style.display = "block";
    }
  
    function toggleNewCategoryInput() {
      newCategoryInput.style.display = categorySelect.value === "new" ? "block" : "none";
      categoryActions.style.display = categorySelect.value !== "new" ? "block" : "none"; // عرض أزرار التعديل والحذف
      editCategoryContainer.style.display = "none"; // إخفاء حقل تعديل القسم
    }
  
    onValue(productsRef, snapshot => {
      const data = snapshot.val() || {};
      categorySelect.innerHTML = `<option disabled selected>اختر قسم</option>`;
      Object.keys(data).forEach(cat => {
        const opt = document.createElement("option");
        opt.value = cat;
        opt.innerText = cat;
        categorySelect.appendChild(opt);
      });
      // خيار إضافة قسم جديد
      const newOpt = document.createElement("option");
      newOpt.value = "new";
      newOpt.innerText = "➕ قسم جديد";
      categorySelect.appendChild(newOpt);
    }, err => console.error("فشل تحميل الأقسام:", err));
  
    // تعديل اسم القسم
    editCategoryBtn.onclick = function () {
      editCategoryContainer.style.display = "block";
      editCategoryNameInput.value = categorySelect.value; // تعيين الاسم الحالي للقسم في الحقل
    };

    saveEditCategoryBtn.onclick = async function editCategory() {
  const oldCategoryName = categorySelect.value;
  const newCategoryName = editCategoryNameInput.value.trim();

  if (newCategoryName && newCategoryName !== oldCategoryName) {
    try {
      loader.style.display = "inline-block";
      const oldCategoryRef = ref(db, `products/${oldCategoryName}`);
      const newCategoryRef = ref(db, `products/${newCategoryName}`);

      // جلب بيانات القسم القديم
      const snapshot = await get(oldCategoryRef);
      const data = snapshot.val();

      if (data) {
        // نقل البيانات من القسم القديم إلى الجديد
        await set(newCategoryRef, data); // استخدام set بدلاً من update
        await remove(oldCategoryRef); // حذف القسم القديم
      }

      showMessage("✅ تم تعديل اسم القسم بنجاح");
      categorySelect.value = newCategoryName; // تغيير القيمة في select
    } catch (error) {
      console.error("حدث خطأ أثناء تعديل اسم القسم:", error);
      showMessage("❌ فشل في تعديل اسم القسم", "red");
    } finally {
      loader.style.display = "none";
      editCategoryContainer.style.display = "none"; // إخفاء حقل تعديل القسم بعد الحفظ
    }
  } else {
    showMessage("❌ يجب إدخال اسم قسم جديد مختلف", "red");
  }
};


    // حذف القسم
    deleteCategoryBtn.onclick = async function deleteCategory() {
      const categoryName = categorySelect.value;
      const confirmDelete = confirm(`هل أنت متأكد من حذف قسم "${categoryName}"؟`);

      if (confirmDelete) {
        try {
          loader.style.display = "inline-block";
          const categoryRef = ref(db, `products/${categoryName}`);
          await remove(categoryRef); // حذف القسم بالكامل

          showMessage(`✅ تم حذف القسم "${categoryName}" بنجاح`);
          categorySelect.value = "اختر قسم"; // إعادة تعيين القائمة
        } catch (error) {
          console.error("حدث خطأ أثناء حذف القسم:", error);
          showMessage("❌ فشل في حذف القسم", "red");
        } finally {
          loader.style.display = "none";
        }
      }
    };
  
    // إضافة منتج
    document.getElementById("add-btn").onclick = async function addProduct() {
      const name = document.getElementById("product-name").value.trim();
      const price = parseFloat(document.getElementById("product-price").value);
      const image = document.getElementById("product-image").value.trim();
      let selectedCategory = categorySelect.value;
      const newCategoryName = newCategoryInput.value.trim();

      if (!name || isNaN(price) || !image || !selectedCategory || (selectedCategory === "new" && !newCategoryName)) {
        showMessage("يرجى ملء جميع الحقول بشكل صحيح", "red");
        return;
      }

      if (selectedCategory === "new") selectedCategory = newCategoryName;

      const newProduct = { name, price, image };
      const categoryRef = ref(db, `products/${selectedCategory}`);

      try {
        loader.style.display = "inline-block";

        // جلب المنتجات داخل القسم لحساب الـ ID
        const snapshot = await get(categoryRef);
        const data = snapshot.val() || {};
        let maxId = 0;

        Object.keys(data).forEach(key => {
          const num = parseInt(key, 10);
          if (!isNaN(num) && num > maxId) maxId = num;
        });

        const newId = (maxId + 1).toString().padStart(4, '0'); // ID مكون من 4 أرقام

        await set(ref(db, `products/${selectedCategory}/${newId}`), newProduct);

        showMessage("✅ تم إضافة المنتج بنجاح");
        document.getElementById("product-name").value = "";
        document.getElementById("product-price").value = "";
        document.getElementById("product-image").value = "";
        newCategoryInput.value = "";
        categorySelect.value = "اختر قسم";
        toggleNewCategoryInput(); 
      } catch (error) {
        console.error("حدث خطأ أثناء الإضافة:", error);
        showMessage("❌ فشل في إضافة المنتج", "red");
      } finally {
        loader.style.display = "none";
      }
    };

    categorySelect.addEventListener("change", toggleNewCategoryInput);
  </script>

</body>
</html>
