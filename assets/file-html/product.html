<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>تفاصيل المنتج</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
  <style>
    #cart-section { display: none; transition: all 0.3s ease-in-out; }
    .slide-down { display: block !important; animation: slideDown 0.5s ease-in-out; }
    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* تصميم رسالة النجاح */
    #response-message {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background-color: #28a745;
      color: white;
      padding: 10px 20px;
      border-radius: 5px;
      font-size: 16px;
      box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
      display: none;
      z-index: 9999;
      opacity: 0;
      transition: opacity 0.3s ease-in-out;
    }
  </style>
</head>
<body class="container py-5">

  <div class="mb-4">
    <button id="cart-toggle" class="btn btn-warning mb-3 position-relative" onclick="toggleCart()">
      🛒 عرض السلة 
      <span id="cart-count" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">0</span>
    </button>
  </div>
  <!-- السلة والنموذج -->
  <div id="cart-section">
    <h3>🛒 السلة</h3>
    <ul id="cart-items" class="list-group mb-3"></ul>
    <p><strong>الإجمالي:</strong> <span id="cart-total">0</span> جنيه</p>

    <div id="response-message"></div>

    <!-- نموذج بيانات العميل -->
    <h4>بيانات العميل</h4>
    <form id="customer-form">
      <div class="mb-3"><input type="text" id="customer-name" class="form-control" placeholder="الاسم" required></div>
      <div class="mb-3"><input type="email" id="customer-email" class="form-control" placeholder="البريد الإلكتروني"></div>
      <div class="mb-3"><input type="tel" id="customer-phone" class="form-control" placeholder="رقم الهاتف"></div>
      <div class="mb-3"><input type="tel" id="customer-alt-phone" class="form-control" placeholder="رقم هاتف بديل"></div>
      <div class="mb-3"><textarea id="customer-address" class="form-control" placeholder="العنوان"></textarea></div>
      <button type="submit" class="btn btn-success">إرسال الطلب</button>
    </form>
  </div>
  <!-- تفاصيل المنتج -->
  <div class="card mb-4" style="max-width: 500px;">
    <img id="product-image" src="" class="card-img-top" alt="صورة المنتج">
    <div class="card-body">
      <h5 class="card-title" id="product-name">اسم المنتج</h5>
      <p class="card-text"><strong>السعر:</strong> <span id="product-price"></span> جنيه</p>
      <p class="card-text"><strong>الوصف:</strong> <span id="product-description"></span></p>
      <p class="card-text"><strong>القسم:</strong> <span id="product-category"></span></p>
      <div class="mb-3 d-flex align-items-center">
        <label for="product-quantity" class="me-2 mb-0"><strong>الكمية:</strong></label>
        <input type="number" id="product-quantity" class="form-control" value="1" min="1" style="width: 100px;" />
      </div>
      <button class="btn btn-primary" onclick="addToCart()">أضف إلى السلة</button>
    </div>
  </div>



  <!-- Firebase و السكربت -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBJkpqCGBRITqc66TQtkdQ_Rj0Jwd5uhZI",
      authDomain: "company-23271.firebaseapp.com",
      databaseURL: "https://company-23271-default-rtdb.firebaseio.com",
      projectId: "company-23271",
      storageBucket: "company-23271.appspot.com",
      messagingSenderId: "48019146673",
      appId: "1:48019146673:web:b4f7bc91bb169c43b29f90"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let cart = JSON.parse(localStorage.getItem('cart')) || [];

    const selectedProduct = JSON.parse(localStorage.getItem('selectedProduct'));

    if (selectedProduct) {
      document.getElementById('product-name').textContent = selectedProduct.name;
      document.getElementById('product-price').textContent = selectedProduct.price;
      document.getElementById('product-description').textContent = selectedProduct.description || 'لا يوجد وصف';
      document.getElementById('product-category').textContent = selectedProduct.category || 'غير محدد';
      document.getElementById('product-image').src = selectedProduct.image || '';
    }

    function addToCart() {
      const quantity = parseInt(document.getElementById('product-quantity').value) || 1;
      const product = {
        name: selectedProduct.name,
        price: selectedProduct.price,
        image: selectedProduct.image,
        quantity: quantity,
      };

      const existing = cart.find(item => item.name === product.name);
      if (existing) {
        existing.quantity += quantity;
      } else {
        cart.push(product);
      }

      updateCartUI();
      showMessage("تمت إضافة المنتج إلى السلة بنجاح!");
    }

    function removeFromCart(item) {
      if (confirm("هل أنت متأكد أنك تريد حذف هذا المنتج؟")) {
        cart = cart.filter(product => product.name !== item.name);
        updateCartUI();
      }
    }

    function updateQuantityInCart(item, newQuantity) {
      const product = cart.find(p => p.name === item.name);
      if (product) {
        product.quantity = parseInt(newQuantity);
        updateCartUI();
      }
    }

    function updateCartUI() {
      const cartItems = document.getElementById('cart-items');
      cartItems.innerHTML = '';
      let total = 0;

      cart.forEach(item => {
        const li = document.createElement('li');
        li.className = 'list-group-item d-flex justify-content-between align-items-center';
        li.innerHTML = `
          <div>
            ${item.name} - ${item.price} × 
            <input type="number" value="${item.quantity}" min="1" class="form-control d-inline-block ms-2" style="width: 60px;"
              onchange="updateQuantityInCart({name: '${item.name}'}, this.value)">
          </div>
          <button class="btn btn-danger btn-sm" onclick='removeFromCart({name: "${item.name}"})'>حذف</button>
        `;
        cartItems.appendChild(li);
        total += item.price * item.quantity;
      });

      document.getElementById('cart-total').textContent = total;
      document.getElementById('cart-count').textContent = cart.length;
      localStorage.setItem('cart', JSON.stringify(cart));
    }

    function toggleCart() {
      document.getElementById('cart-section').classList.toggle('slide-down');
    }

    function resetCart() {
      cart = [];
      updateCartUI();
      localStorage.removeItem('cart');
    }

    function resetCustomerForm() {
      document.getElementById('customer-form').reset();
    }

    function calculateTotal() {
      return cart.reduce((sum, item) => sum + item.price * item.quantity, 0);
    }

    function generateCustomerID() {
      return db.ref('customers').once('value').then(snapshot => {
        const customers = snapshot.val();
        const ids = customers ? Object.keys(customers) : [];
        let maxId = 0;
        ids.forEach(id => {
          const num = parseInt(id);
          if (!isNaN(num) && num > maxId) {
            maxId = num;
          }
        });
        return (maxId + 1).toString().padStart(5, '0');
      });
    }

    function handleOrderSubmission(event) {
      event.preventDefault();

      if (cart.length === 0) {
        showMessage("السلة فارغة. أضف منتجات قبل إرسال الطلب.", "danger");
        return;
      }

      const name = document.getElementById('customer-name').value;
      const phone = document.getElementById('customer-phone').value;
      const email = document.getElementById('customer-email').value;
      const altPhone = document.getElementById('customer-alt-phone').value;
      const address = document.getElementById('customer-address').value;

      if (!name || !phone || !email || !address) {
        showMessage("يرجى ملء جميع البيانات الأساسية", "danger");
        return;
      }

      generateCustomerID().then(customerID => {
        const timestamp = new Date().toISOString();
        const orderDetails = cart.map(item => ({
          name: item.name,
          price: item.price,
          quantity: item.quantity,
          total: item.price * item.quantity
        }));
        const totalAmount = calculateTotal();

        const customerOrder = {
          name, phone, email, altPhone, address,
          order: orderDetails,
          timestamp,
          totalAmount
        };

        db.ref('customers/' + customerID).set(customerOrder, (error) => {
          if (error) {
            showMessage("حدث خطأ أثناء إرسال الطلب", "danger");
          } else {
            showMessage("تم تقديم الطلب بنجاح!", "success");
            resetCart();
            resetCustomerForm();
          }
        });
      });
    }

    function showMessage(message, type = 'success') {
      const box = document.getElementById('response-message');
      box.textContent = message;
      box.className = `alert alert-${type}`;
      box.style.display = 'block';
      box.style.opacity = 1;

      setTimeout(() => {
        box.style.opacity = 0;
        setTimeout(() => {
          box.style.display = 'none';
        }, 300);
      }, 4000);
    }

    document.getElementById('customer-form').addEventListener('submit', handleOrderSubmission);

    // تحميل السلة عند فتح الصفحة
    updateCartUI();
  </script>
</body>
</html>
